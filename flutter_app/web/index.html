<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="edugenai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EduGenAI</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Identity Services (One Tap) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Called by the GIS SDK when the user picks an account in the One Tap prompt.
    // We store the credential JWT so Dart can retrieve it via JS interop.
    window._googleOneTapCredential = null;
    window._googleOneTapCallback  = null;

    function handleGoogleOneTapResponse(response) {
      window._googleOneTapCredential = response.credential;
      // If Dart already registered a callback, fire it immediately.
      if (typeof window._googleOneTapCallback === 'function') {
        window._googleOneTapCallback(response.credential);
      }
    }

    // Called from Dart to initialise One Tap and show the prompt.
    function initGoogleOneTap(clientId) {
      if (!window.google || !window.google.accounts) {
        console.warn('GIS not ready yet – retrying in 500 ms');
        setTimeout(function() { initGoogleOneTap(clientId); }, 500);
        return;
      }
      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleGoogleOneTapResponse,
        auto_select: true,           // silently picks account if only one
        cancel_on_tap_outside: false // keep prompt visible
      });
      google.accounts.id.prompt();   // show the "Continue as …" popup
    }

    // Called from Dart to cancel the One Tap prompt (e.g. user signs in another way).
    function cancelGoogleOneTap() {
      if (window.google && window.google.accounts) {
        google.accounts.id.cancel();
      }
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
