name: edugenai
description: AI-Based Multilingual Animated Audio & Video Generator for Education
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.2
  video_player: ^2.8.2
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
